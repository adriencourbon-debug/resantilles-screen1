<style>
:root{--bg:#06070E;--rose:#E8335E;--teal:#00B1B2;--gold:#FBBA00;--white:#FFFFFF;--current-accent:#E8335E}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:"Outfit",sans-serif;color:var(--white)}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:80px 80px;pointer-events:none;z-index:0}

header{position:fixed;top:0;left:0;right:0;height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;z-index:100;background:rgba(6,7,14,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
.logo-wrap{display:flex;align-items:center}
.logo-wrap img{height:40px;width:auto;display:block}
.header-right{display:flex;align-items:center;gap:16px}
.header-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:.22em}
.dot-sep{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.15)}
.slide-counter{font-size:13px;font-weight:700;color:rgba(255,255,255,.4);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.slide-counter .cur{color:var(--white);font-size:15px}

main{position:fixed;inset:80px 0 62px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slides-container{position:relative;width:100%;height:100%}

.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 100px;opacity:0;pointer-events:none}
.slide.entering{animation:sIn .7s cubic-bezier(.16,1,.3,1) forwards}
.slide.exiting{animation:sOut .6s cubic-bezier(.7,0,.84,0) forwards}
@keyframes sIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes sOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}

.ghost-num{font-family:"Bebas Neue",sans-serif;font-size:min(38vw,420px);line-height:.85;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.042;color:var(--accent);user-select:none;pointer-events:none;letter-spacing:-.02em}

.slide-content{position:relative;z-index:5;text-align:center;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:28px}

.rule-tag{display:inline-flex;align-items:center;gap:10px;padding:8px 24px;border-radius:100px;border:1.5px solid var(--accent);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.tag-num{font-family:"Bebas Neue",sans-serif;font-size:14px;letter-spacing:.15em}

.rule-title{font-size:clamp(30px,4.6vw,60px);font-weight:800;line-height:1.1;letter-spacing:-.025em;color:var(--white)}
.rule-title em{font-style:normal;color:var(--accent)}

.rule-divider{width:56px;height:3px;background:var(--accent);border-radius:2px}
.rule-text{font-size:clamp(15px,1.75vw,21px);font-weight:400;line-height:1.72;color:rgba(255,255,255,.66);max-width:700px}
.rule-proposed{margin-top:4px;padding:10px 22px;border-radius:8px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);font-size:10.5px;font-weight:500;color:rgba(255,255,255,.25);letter-spacing:.1em;text-transform:uppercase}

footer{position:fixed;bottom:0;left:0;right:0;height:62px;display:flex;align-items:center;padding:0 56px;gap:20px;z-index:100;background:rgba(6,7,14,.92);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08)}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.16);transition:all .4s ease;cursor:pointer}
.dot.active{width:24px;border-radius:3px;background:var(--current-accent)}
.progress-track{flex:1;height:2px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;background:var(--current-accent);width:0%;transition:background .5s ease}
.time-lbl{font-size:11px;color:rgba(255,255,255,.2);font-weight:500;min-width:28px;text-align:right}
</style>
</head>

<script>
const DURATION=8000,TRANS=680;
const R="#E8335E",T="#00B1B2",G="#FBBA00";
const rules=[
  {num:"01",accent:R,tag:"Priorité N°1",title:"Le client d'abord, <em>toujours</em>",text:"Nos clients nous font vivre. Nous soignons chacun d'eux avec la même exigence et la même attention — à chaque interaction, sans exception."},
  {num:"02",accent:T,tag:"Réactivité",title:"Répondre dans <em>la journée</em>",text:"Nous répondons à chaque demande client le jour même. Si c'est impossible, nous le prévenons. Le silence n'est jamais une réponse acceptable."},
  {num:"03",accent:G,tag:"Croissance",title:"Nos clients, nos <em>meilleurs ambassadeurs</em>",text:"Un client satisfait nous recommande. C'est notre levier commercial le plus puissant. Chaque interaction est une opportunité de grandir ensemble."},
  {num:"04",accent:R,tag:"Bien-être équipe",title:"Prenons soin de <em>nos collaborateurs</em>",text:"Des collaborateurs épanouis créent des clients satisfaits. Nous nous respectons mutuellement, nous nous soutenons et nous nous faisons confiance."},
  {num:"05",accent:T,tag:"Compétences",title:"Toujours <em>en progression</em>",text:"Nous ne subissons pas l'évolution technologique, nous l'anticipons. La formation est notre responsabilité individuelle — nous sommes proactifs, sans attendre que tout vienne de l'entreprise."},
  {num:"06",accent:G,tag:"Traçabilité",title:"Tout dans <em>le CRM / ERP</em>",text:"Ce qui n'est pas tracé n'existe pas. Tickets, devis, interventions, relances — nous renseignons nos outils systématiquement pour garantir un suivi irréprochable."},
  {num:"07",accent:R,tag:"Culture d'équipe",title:"La transparence <em>avant tout</em>",text:"On informe ses collègues de ses problématiques. On partage l'information en équipe chaque semaine. L'information retenue est un frein collectif."},
  {num:"08",accent:T,tag:"Communication",title:"<em>Zéro email</em> en interne",text:"L'email est réservé à nos clients et partenaires externes. En interne, nous utilisons nos outils collaboratifs pour des échanges plus rapides et plus traçables."},
  {num:"09",accent:G,tag:"Professionnalisme",title:"Le geste <em>irréprochable</em>",text:"On prévient le client avant d'intervenir, on bloque son agenda, et on lui fait un récap complet après chaque intervention. Chaque détail reflète notre image."},
  {num:"10",accent:R,tag:"Engagement",title:"On tient <em>chaque promesse</em>",text:"On ne promet que ce qu'on peut tenir — et on tient tout ce qu'on promet. Un engagement non respecté, c'est un client perdu et une réputation entamée.",proposed:true}
];

const sc=document.getElementById("sc"),dotsEl=document.getElementById("dots"),pf=document.getElementById("pf"),curNum=document.getElementById("curNum"),tl=document.getElementById("tl");
let idx=0,rAF=null,t0=null;

rules.forEach((r,i)=>{
  const s=document.createElement("div");
  s.className="slide";
  s.style.setProperty("--accent",r.accent);
  s.innerHTML=`<div class="ghost-num">${r.num}</div><div class="slide-content"><div class="rule-tag"><span class="tag-num">RÈGLE ${r.num}</span><span>·</span><span>${r.tag.toUpperCase()}</span></div><h2 class="rule-title">${r.title}</h2><div class="rule-divider"></div><p class="rule-text">${r.text}</p>${r.proposed?'<div class="rule-proposed">✦ Règle proposée — à valider en équipe</div>':""}</div>`;
  sc.appendChild(s);
  const d=document.createElement("div");
  d.className="dot";
  d.onclick=()=>go(i);
  dotsEl.appendChild(d);
});

const slides=document.querySelectorAll(".slide"),dots=document.querySelectorAll(".dot");

function setAccent(a){document.documentElement.style.setProperty("--current-accent",a)}

function go(i){
  const old=slides[idx];
  old.classList.remove("entering");
  old.classList.add("exiting");
  setTimeout(()=>old.classList.remove("exiting"),TRANS);
  idx=i;
  dots.forEach((d,k)=>d.classList.toggle("active",k===idx));
  curNum.textContent=rules[idx].num;
  setAccent(rules[idx].accent);
  setTimeout(()=>{slides[idx].classList.add("entering");startProg();},90);
}

function startProg(){
  if(rAF)cancelAnimationFrame(rAF);
  pf.style.width="0%";
  t0=performance.now();
  const tick=now=>{
    const e=now-t0,p=Math.min(e/DURATION*100,100);
    pf.style.width=p+"%";
    tl.textContent=Math.max(0,Math.ceil((DURATION-e)/1000))+"s";
    if(e<DURATION){rAF=requestAnimationFrame(tick)}else{go((idx+1)%rules.length)}
  };
  rAF=requestAnimationFrame(tick);
}

setAccent(rules[0].accent);
dots[0].classList.add("active");
slides[0].classList.add("entering");
curNum.textContent=rules[0].num;
setTimeout(startProg,700);
</script>
